<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | أفق التعليمية</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#176b62,#0e514b);font-family:Cairo,Tahoma;color:#172b35}.box{width:min(390px,calc(100% - 40px));background:#fff;border-radius:18px;padding:35px;box-shadow:0 20px 60px #0004}.logo{margin:auto;background:#e8f5f1;color:#176b62;width:65px;height:65px;border-radius:16px;display:grid;place-items:center;font-size:38px;font-weight:800}.box{text-align:center}.box h1{margin:14px 0 5px}.box p{color:#71808a;font-size:13px}form{text-align:right;margin-top:25px}label{display:block;font-size:12px;margin:14px 0 6px}input,select,button{width:100%;padding:12px;border-radius:9px;border:1px solid #e6eceb;font:13px Cairo;box-sizing:border-box}button{margin-top:22px;background:#176b62;color:#fff;border:0;cursor:pointer}.demo{margin-top:20px;background:#e8f5f1;color:#176b62;border-radius:10px;padding:12px;font-size:11px}</style></head><body><div class="box"><div class="logo">أ</div><h1>أفق التعليمية</h1><p>منصة التعليم الإلكترونية الذكية</p><form onsubmit="login(event)"><label>الدور</label><select id="role" required><option value="">اختر دورك</option><option value="admin">المدير</option><option value="teacher">المعلم</option><option value="student">الطالب</option><option value="parent">ولي الأمر</option></select><label>اسم المستخدم</label><input id="username" required placeholder="أدخل اسم المستخدم"><label>كلمة المرور</label><input id="password" type="password" required placeholder="123456"><button>تسجيل الدخول</button></form><div class="demo">الحسابات التجريبية: admin أو teacher أو student أو parent<br>كلمة المرور: 123456</div></div><script>function login(e){e.preventDefault();if(document.getElementById('password').value!=='123456')return alert('بيانات الدخول غير صحيحة');localStorage.setItem('user',JSON.stringify({username:username.value,role:role.value,name:username.value}));location.href='index.html'}</script></body></html>
